<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
    <meta name="theme-color" content="#F2F2F7" />
    <!-- CRITIQUE : force iOS Safari à utiliser le rendu CLAIR, sinon
         WebKit applique des styles dark par défaut quand l'iPhone est en mode sombre. -->
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MacroTrack" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Typographie commune à GymTrack : Plus Jakarta Sans (titres, chiffres) + Inter
         (texte). Mise en cache par le service worker : disponible hors ligne. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Fond inline : lisible même avant le chargement du CSS. -->
    <style>
      :root, html, body { color-scheme: light only; }
      html, body { background-color: #F2F2F7; color: #1D1D1F; }
    </style>

    <title>MacroTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
