    <path d="M32 20 C28.5 15.5 21.5 14 16.5 17.5 C10.5 21.5 9.5 30.5 12.5 38.5 C15 45 19 50.5 23 52 C26 53 29.5 51.5 32 51.5 C34.5 51.5 38 53 41 52 C45 50.5 49 45 51.5 38.5 C54.5 30.5 53.5 21.5 47.5 17.5 C42.5 14 35.5 15.5 32 20 Z" fill="#fff"/>
    <!-- Feuille et tige volontairement epaisses : a 32 px elles maigrissent
         vite et doivent rester lisibles comme un chapeau distinct. -->
    <path d="M35 18.6 C35 11.5 40.5 6.5 48.5 6.5 C48.5 14 43 18.4 36.2 19.2 Z" fill="#fff"/>
    <path d="M31.8 19 C31 14.5 30.5 11.5 30.2 9.5" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
